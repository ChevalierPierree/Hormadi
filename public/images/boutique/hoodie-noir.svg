<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#012e24;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#012e24;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)"/>
  
  <!-- Diagonal accent stripe -->
  <polygon points="0,500 300,0 450,0 0,600" fill="#012e24" opacity="0.08"/>
  <polygon points="500,800 800,300 800,450 600,800" fill="#012e24" opacity="0.06"/>
  
  <!-- Small accent line -->
  <rect x="50" y="680" width="80" height="4" rx="2" fill="#012e24"/>
  
  <!-- Hormadi logo circle -->
  <circle cx="400" cy="320" r="120" fill="#012e24" opacity="0.12"/>
  <text x="400" y="340" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="#012e24" opacity="0.25" text-anchor="middle">H</text>
  
  <!-- Product name -->
  <text x="50" y="700" font-family="Arial Black, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="2">HOODIE</text>
  <text x="50" y="750" font-family="Arial Black, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="2">NOIR</text>
  
  <!-- Brand -->
  <text x="750" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" opacity="0.4" text-anchor="end" letter-spacing="3">HORMADI ANGLET</text>
</svg>